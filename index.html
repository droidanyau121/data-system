<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料管理系統 - 本地版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 QR Code 掃描庫 (CDN 連結) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .input-locked {
            background-color: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
            border-color: #e5e7eb;
        }
        .tab-active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- 頂部導覽列 (Tabs) -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-around">
            <button onclick="switchTab('home')" id="tab-home" class="py-4 px-6 text-gray-500 hover:text-blue-500 transition-all tab-active">Home</button>
            <button onclick="switchTab('input')" id="tab-input" class="py-4 px-6 text-gray-500 hover:text-blue-500 transition-all">Data Input</button>
            <button onclick="switchTab('report')" id="tab-report" class="py-4 px-6 text-gray-500 hover:text-blue-500 transition-all">Report</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 md:p-8">
        
        <!-- Home 分頁: 顯示本地儲存資料 -->
        <section id="content-home" class="tab-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">資料總匯 (Home)</h2>
                <span class="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">本地記憶體模式</span>
            </div>
            <div class="bg-white rounded-xl shadow overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">輸入時間</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">資料 1</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">資料 2</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">資料 3</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body" class="bg-white divide-y divide-gray-200 text-sm">
                        <tr id="empty-row"><td colspan="4" class="px-6 py-10 text-center text-gray-400">尚無輸入紀錄</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Data Input 分頁: 輸入介面 -->
        <section id="content-input" class="tab-content hidden">
            <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">新增資料 (Data Input)</h2>
                
                <div class="space-y-6">
                    <!-- Data 1 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">資料 1 (自由輸入)</label>
                        <input type="text" id="data1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <!-- Data 2 (自動鎖定) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">資料 2 (輸入後自動鎖定)</label>
                        <input type="text" id="data2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter 或離開焦點即鎖定">
                    </div>

                    <!-- Data 3 (手動輸入 / QR 掃描) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">資料 3 (QR Code 掃描 / 手動)</label>
                        <div class="flex gap-2">
                            <input type="text" id="data3" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="請掃描或手動輸入...">
                            <button onclick="toggleScanner()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex items-center transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </button>
                        </div>
                        <div id="reader" class="mt-4 border-2 border-dashed border-gray-200 rounded-lg overflow-hidden hidden"></div>
                    </div>

                    <!-- 提交按鈕 -->
                    <div class="flex flex-col gap-2 pt-4">
                        <button id="submit-btn" onclick="submitData()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition-all shadow-md">
                            提交資料至 Home
                        </button>
                        <button onclick="resetForm()" class="text-sm text-gray-500 hover:text-gray-700">清空當前輸入內容</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Report 分頁 -->
        <section id="content-report" class="tab-content hidden text-center py-20">
            <p class="text-gray-400 italic text-lg">報表功能開發中...</p>
        </section>

    </main>

    <script>
        // --- 本地資料儲存陣列 ---
        let localData = [];
        let html5QrCode = null;

        /**
         * 提交資料並切換至 Home
         */
        window.submitData = function() {
            const d1 = document.getElementById('data1').value.trim();
            const d2 = document.getElementById('data2').value.trim();
            const d3 = document.getElementById('data3').value.trim();

            // 若全為空則不處理
            if (!d1 && !d2 && !d3) return;

            const newRecord = {
                timestamp: new Date().toLocaleString(),
                d1: d1 || "-",
                d2: d2 || "-",
                d3: d3 || "-"
            };

            // 存入陣列 (最新資料置頂)
            localData.unshift(newRecord);
            
            updateTableUI();
            resetForm();
            switchTab('home');
        };

        /**
         * 更新首頁表格內容
         */
        function updateTableUI() {
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = '';

            if (localData.length === 0) {
                tbody.innerHTML = `<tr id="empty-row"><td colspan="4" class="px-6 py-10 text-center text-gray-400">尚無輸入紀錄</td></tr>`;
                return;
            }

            localData.forEach(item => {
                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50 transition-colors";
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-gray-600">${item.timestamp}</td>
                    <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${item.d1}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-600">${item.d2}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-600">${item.d3}</td>
                `;
                tbody.appendChild(row);
            });
        }

        /**
         * 切換分頁邏輯
         */
        window.switchTab = async function(tabId) {
            // 如果切換走，關閉掃描器
            if (tabId !== 'input') await stopScanner();

            // 隱藏所有分頁
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            // 移除導覽列啟動樣式
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('tab-active'));
            
            // 顯示當前分頁
            document.getElementById(`content-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('tab-active');
        };

        // --- Data 2 自動鎖定處理 ---
        const d2Input = document.getElementById('data2');
        const applyLock = () => {
            if (d2Input.value.trim() !== "" && !d2Input.readOnly) {
                d2Input.readOnly = true;
                d2Input.classList.add('input-locked');
            }
        };
        // 監聽 Enter 與 失去焦點事件
        d2Input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { applyLock(); d2Input.blur(); } });
        d2Input.addEventListener('blur', applyLock);

        // --- QR Code 掃描器控制 ---
        window.toggleScanner = async function() {
            const readerDiv = document.getElementById('reader');
            
            // 如果正在掃描，則關閉
            if (html5QrCode && html5QrCode.isScanning) {
                await stopScanner();
                return;
            }

            readerDiv.classList.remove('hidden');
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

            try {
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: { width: 250, height: 250 } }, 
                    (decodedText) => {
                        document.getElementById('data3').value = decodedText;
                        stopScanner();
                    }
                );
            } catch (err) {
                console.error("相機存取失敗:", err);
                readerDiv.innerHTML = `<p class="p-4 text-red-500 text-center text-sm">相機啟動失敗，請確保具備鏡頭存取權限。</p>`;
                setTimeout(() => { if (!html5QrCode.isScanning) readerDiv.classList.add('hidden'); }, 3000);
            }
        };

        async function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                try {
                    await html5QrCode.stop();
                    document.getElementById('reader').classList.add('hidden');
                } catch (err) {
                    console.warn("停止掃描時發生錯誤:", err);
                }
            }
        }

        /**
         * 重置表單
         */
        window.resetForm = function() {
            document.getElementById('data1').value = "";
            d2Input.value = "";
            d2Input.readOnly = false;
            d2Input.classList.remove('input-locked');
            document.getElementById('data3').value = "";
            stopScanner();
        };
    </script>
</body>
</html>
